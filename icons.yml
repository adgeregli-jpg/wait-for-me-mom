# icons/*.png.b64 metin dosyalarından PNG simgelerini üretir ve depoya ekler
name: Simgeleri olustur
on:
  push:
    paths: ["icons/*.b64"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base64 -> PNG
        run: |
          for f in icons/*.png.b64; do base64 -d "$f" > "${f%.b64}"; done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add icons/*.png
          git diff --cached --quiet || git commit -m "Simgeler olusturuldu"
          git push
