<!doctype html>
<html lang="tr">
<head>

  <meta name="theme-color" content="#f7b6c2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wait for Me, Mom">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img class="brand-logo" src="icons/icon-192.png" alt="">Wait for Me, Mom</div>
      <div class="top-right"><div class="top-week" id="topWeek"></div><select class="lang-sel" id="langSel" aria-label="Language"></select></div>
    </div>
  </header>

  <main>
    <section class="page" id="p-bugun"></section>
    <section class="page" id="p-beslenme"></section>
    <section class="page" id="p-bebegim"></section>
    <section class="page" id="p-diyet"></section>
    <section class="page" id="p-ben"></section>

  <nav class="nav">
    <div class="nav-inner">
      <button data-p="bugun" class="active"><span class="ico">🏠</span><span data-i18n="nav_today">Bugün</span></button>
      <button data-p="beslenme"><span class="ico">🍽️</span><span data-i18n="nav_food">Beslenme</span></button>
      <button data-p="bebegim"><span class="ico">👶</span><span data-i18n="nav_baby">Bebeğim</span></button>
      <button data-p="diyet"><span class="ico">🥗</span><span data-i18n="nav_diet">Diyetler</span></button>
      <button data-p="ben"><span class="ico">📈</span><span data-i18n="nav_me">Ben</span></button>
    </div>
  </nav>

  <div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
  <div class="welcome hidden" id="welcome"><div class="card" id="welcomeBody"></div></div>
  <div class="toast" id="toast"></div>

  <script src="js/foods.js"></script>
  <script src="js/weeks.js"></script>
  <script src="js/content.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/de.js"></script>
  <script src="js/lang/ar.js"></script>
  <script src="js/lang/ru.js"></script>
  <script src="js/app.js"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
